name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend — vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # 67k lines of JS had no linter at all. The 289 pre-existing violations are
      # recorded in frontend/eslint-suppressions.json rather than the rules being
      # weakened to accommodate them: this step fails on any NEW violation, and the
      # baseline file is the burn-down list. `npm run lint:prune` shrinks it as they
      # are fixed.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

      # Two budgets, because the entry-chunk one alone missed a real regression.
      #
      # 1. Entry chunk: the eager-glob regression once put all 45 module pages into a
      #    single 1,474 kB entry chunk.
      # 2. Largest chunk: statically importing the three data barrels put all 60
      #    modules' design content into one 1,142 kB *shared* chunk that every module
      #    page pulled in. The entry chunk stayed well inside budget the whole time,
      #    so this check passed while a third of the build shipped on every page view.
      - name: Check chunk size budgets
        working-directory: frontend
        run: |
          entry=$(ls -1 dist/assets/index-*.js | head -1)
          size=$(stat -c%s "$entry")
          limit=$((500 * 1024))
          printf 'entry chunk %s = %s bytes (limit %s)\n' "$entry" "$size" "$limit"

          biggest=$(ls -S dist/assets/*.js | grep -v '/index-' | head -1)
          bsize=$(stat -c%s "$biggest")
          blimit=$((250 * 1024))
          printf 'largest non-entry chunk %s = %s bytes (limit %s)\n' "$biggest" "$bsize" "$blimit"
          if [ "$bsize" -gt "$blimit" ]; then
            echo "::error::$biggest is $bsize bytes, over the ${blimit}-byte budget. Is shared data being imported statically instead of through a lazy barrel?"
            exit 1
          fi

          if [ "$size" -gt "$limit" ]; then
            echo "::error::Entry chunk is $size bytes, over the ${limit}-byte budget. Is a module page being imported eagerly?"
            exit 1
          fi
