# Override with the BACKEND_PORT env var (falls back to 59190, chosen from the
# IANA dynamic/private range so it never collides with a registered service).
# PORT takes priority when set -- most PaaS free tiers (Render, Railway, Fly.io)
# inject PORT themselves and require the app to bind to it.
server.port=${PORT:${BACKEND_PORT:59190}}

# Render (and most PaaS free tiers) terminate TLS at a reverse proxy in front of
# this app and forward the original scheme/host via X-Forwarded-* headers. Without
# this, Spring thinks every request arrived over plain http on the proxy's internal
# port, so springdoc builds the OpenAPI document's "servers" URL (and any redirect
# Location header, e.g. /swagger-ui.html -> /swagger-ui/index.html) as http://...
# -- an https page then refuses to fetch it as mixed content, and Swagger UI shows
# "Failed to load API definition". Trusting forwarded headers fixes the scheme.
server.forward-headers-strategy=framework

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false

# Keep exception messages in the default error body. Spring Boot 3 strips them by
# default, which made the frontend's `body.error || body.message` lookup fall back
# to a bare "HTTP 500 Internal Server Error" with no reason for the caller.
server.error.include-message=always
