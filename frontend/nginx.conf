server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support React Router single page application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API endpoints to backend Spring Boot container
    location /api/ {
        proxy_pass http://backend:9090/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger UI and the OpenAPI spec live on the backend as well, so the in-app
    # "Swagger API" link resolves on this origin instead of a hardcoded host.
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
