version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lld-backend
    ports:
      - "9090:9090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lld-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
