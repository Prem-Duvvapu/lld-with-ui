version: '3.8'

# BACKEND_PORT / FRONTEND_PORT override only the *host*-side port each
# container is published on (e.g. `BACKEND_PORT=8081 docker compose up`) —
# container-internal ports stay fixed at the app defaults, so nginx's
# proxy_pass to the backend container never needs to change.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lld-backend
    ports:
      - "${BACKEND_PORT:-59190}:59190"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lld-frontend
    ports:
      - "${FRONTEND_PORT:-53000}:80"
    depends_on:
      - backend
    restart: unless-stopped
